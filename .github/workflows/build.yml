name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version number is the commit count, so the whole history is needed.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.0
      # One key signs every build, so each release installs over the previous one and keeps the data.
      - name: Signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eatezy.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/eatezy.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the APK is unsigned and is not released."
          fi
      - name: Tests
        run: gradle :app:testDebugUnitTest --tests "app.eatezy.LogicTest" --console=plain
      - name: APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --console=plain
      - id: version
        run: echo "name=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - run: mv app/build/outputs/apk/release/app-release*.apk "EatEzy-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: EatEzy-${{ steps.version.outputs.name }}
          path: EatEzy-*.apk
      - uses: softprops/action-gh-release@v2
        # Only signed builds become releases.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: EatEzy ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: EatEzy-*.apk
          make_latest: true
